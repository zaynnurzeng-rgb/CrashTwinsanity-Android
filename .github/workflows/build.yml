# Builds Crash Twinsanity for Android. For each v* tag it also publishes a release; run by hand (Actions > Build >
# Run workflow) and it uploads the APK and the generated config/game.toml as artifacts.
#
# The recompiler needs assets/default.xbe. Commit it to the repository, or put a disc image in assets/*.iso: the
# workflow extracts default.xbe from the first one it finds.
#
# Secrets (optional): KEYSTORE_BASE64 (the release .jks in base64), KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD.
# Without the keystore the APK has a debug signature.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.31.6
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the tags and commits, for the list of changes since the previous release

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Android SDK packages
        shell: cmd
        run: call "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" --install "platforms;android-34" "ndk;%NDK_VERSION%" "cmake;%CMAKE_VERSION%" >nul

      - name: Prepare default.xbe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          if [ -f assets/default.xbe ]; then
            echo "Using assets/default.xbe from the repository"
            exit 0
          fi
          iso="$(find assets -maxdepth 1 -type f -iname '*.iso' -print -quit)"
          if [ -z "$iso" ]; then
            echo "::error::assets/default.xbe is missing and there is no assets/*.iso to extract it from"
            exit 1
          fi
          echo "Extracting default.xbe from $iso"
          python -I tools/xdvdfs.py "$iso" default.xbe assets/default.xbe

      - name: Release key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::No release keystore: the APK has a debug signature"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "BLACK_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "BLACK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BLACK_KEY_ALIAS=$KEY_ALIAS"
            echo "BLACK_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Version
        id: version
        shell: bash
        run: |
          # a tag names the version; a run by hand is the commit's
          if [ "$RELEASE" = "true" ]; then name="${GITHUB_REF_NAME#v}"; else name="dev-${GITHUB_SHA::7}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "GRADLE_ARGS=-PversionCode=${{ github.run_number }} -PversionName=$name" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: ./build.bat

      - name: Upload config/game.toml
        uses: actions/upload-artifact@v5
        with:
          name: CrashTwinsanity-${{ steps.version.outputs.name }}-game-toml
          path: config/game.toml
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: CrashTwinsanity-${{ steps.version.outputs.name }}-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Name the APK
        shell: bash
        run: mv app/build/outputs/apk/release/app-release.apk "CrashTwinsanity-${{ steps.version.outputs.name }}.apk"

      - name: Release notes
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          apk="CrashTwinsanity-${{ steps.version.outputs.name }}.apk"
          size=$(awk -v b="$(stat -c %s "$apk")" 'BEGIN { printf "%.1f MB", b / 1048576 }')
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          sed -e "s|{{VERSION}}|$GITHUB_REF_NAME|g" -e "s|{{TAG}}|$GITHUB_REF_NAME|g" -e "s|{{APK}}|$apk|g" \
              -e "s|{{SIZE}}|$size|g" -e "s|{{SHA256}}|$sha|g" -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" \
              ci/release-notes.md > "$RUNNER_TEMP/release-notes.md"
          # the commits since the previous tag, which the app's update dialog shows too
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo
            echo "## What's Changed"
            echo
            git log --no-merges --pretty='* %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME"
          } >> "$RUNNER_TEMP/release-notes.md"

      - name: Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Crash Twinsanity for Android ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: CrashTwinsanity-${{ steps.version.outputs.name }}.apk
          make_latest: true
