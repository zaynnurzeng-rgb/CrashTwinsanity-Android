# Recompiler input for default.xbe (Crash Twinsanity, original Xbox, title 56550026)
#
# build.bat runs xbe_symbols while the symbol table is missing. xbe_symbols reads assets/default.xbe and rewrites this
# file with the image's real entry point, partition count, code sections, extra entry points, library symbols, data
# addresses and ABI, so the image-specific values below are filled in on the first build.

[xbe]
path = "assets/default.xbe"
title = 0x56550026
xdk = 5849
out = "generated/game"

# extra entry points (xbe_symbols fills this table)
[functions]

# game hooks, defined in src/game/
# none yet: the old Shaolin Monks hook addresses do not apply to the Crash Twinsanity image
